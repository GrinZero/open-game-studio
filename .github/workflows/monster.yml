name: Monster
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: python -m pip install numpy
      - run: npm run monster:check
      - run: npm run monster:package
      - uses: actions/upload-artifact@v4
        with:
          name: monster-colab
          path: packages/monster/dist/
