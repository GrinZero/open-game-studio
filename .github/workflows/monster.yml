name: Monster
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: >-
          python -m pip install numpy pillow "scipy>=1.11,<2"
          "scikit-image>=0.24,<1" "threadpoolctl>=3,<4"
          "opencv-python-headless>=4.10,<5"
      # Reader regression tests use a tiny backbone and need no CUDA runtime.
      - run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run monster:check
      - run: npm run monster:package
      - uses: actions/upload-artifact@v4
        with:
          name: monster-colab
          path: packages/monster/dist/
