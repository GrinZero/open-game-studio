<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐帧叠图评分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151b;color:#e9edf2;font:15px/1.6 system-ui,sans-serif;padding:24px}h1{font-size:24px;margin:0}p{margin:8px 0}select,input{accent-color:#70dfed}select{padding:8px;background:#202b36;color:inherit;border:1px solid #495b6c;border-radius:6px}header,nav,article{max-width:1500px;margin:0 auto 18px}nav{display:flex;gap:16px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}#status{color:#ffc982}#metrics{white-space:pre-wrap;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#1a242e;padding:12px;border-radius:10px}.card h2{font-size:15px;margin:0 0 8px}.card img{width:100%;display:block}.stack{position:relative}.stack img+img{position:absolute;inset:0;height:100%;object-fit:contain}.cyan{color:#1ef0ff}.magenta{color:#ff37d2}details{margin:14px 0}a{color:#88d9fa}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:6px 12px;border-bottom:1px solid #32414f;text-align:left}.bad{color:#ff9aaf}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<header><h1 id="title"></h1><p id="status"></p><p><span class="cyan">青：参考</span> · <span class="magenta">紫：当前模型</span> · 白：重合。原始坐标计算，页面缩放仅用于展示。</p><p>指标只衡量二维轮廓；完整报告也不代表动作质量自动通过。<a href="report.json">JSON</a> · <a href="per_frame.csv">CSV</a></p></header>
<nav><label>帧 <select id="frame"></select></label><label>视角 <select id="view"></select></label><label>评分区域 <select id="region"></select></label><label>当前模型透明度 <input id="alpha" type="range" min="0" max="1" step="0.01" value="0.5"></label><label><input id="contour" type="checkbox" checked>差异轮廓</label></nav>
<article><p id="metrics"></p><div class="grid"><section class="card"><h2>参考</h2><img id="reference" alt="参考帧"></section><section class="card" id="before-card"><h2>修复前</h2><img id="baseline" alt="修复前帧"></section><section class="card"><h2>当前模型</h2><img id="candidate" alt="当前模型帧"></section><section class="card"><h2>同坐标叠放</h2><div class="stack"><img id="bottom" alt="参考底图"><img id="top" alt="当前模型透明叠放"></div><img id="overlay" alt="轮廓叠图"></section></div><details><summary>分割检查：参考/当前 mask 的原坐标重合</summary><img id="mask" style="max-height:650px;max-width:100%" alt="分割蒙版对比"></details><details><summary>配对汇总（相同有效帧集合）</summary><table><thead><tr><th>视角 / 区域</th><th>帧数</th><th>修复前 IoU</th><th>当前 IoU</th><th>变化</th></tr></thead><tbody id="summary"></tbody></table></details><details><summary>输入与覆盖情况</summary><pre id="coverage" style="white-space:pre-wrap"></pre></details></article>
<script type="application/json" id="data">__REPORT_DATA__</script>
<script>
const report=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),fmt=(n,p=4)=>n==null?'—':n.toFixed(p);
$('title').textContent=report.config.action+' · 逐帧叠图评分';
$('status').textContent=`${report.status==='complete'?'比较数据完整':'诊断报告 · 尚不完整'} | 可比较 ${report.coverage.available_frames.length}/${report.coverage.total_frames} 帧 | 缺失 ${report.missing.length} 项 | 无效 ${report.invalid.length} 项 | 相机/同步声明：${report.alignment.status}`;
$('coverage').textContent=JSON.stringify({alignment:report.alignment,coverage:report.coverage,missing:report.missing,invalid:report.invalid},null,2);
function options(id,items){const previous=$(id).value;$(id).replaceChildren(...items.map(value=>new Option(String(value),String(value))));if(items.map(String).includes(previous))$(id).value=previous}
options('frame',report.coverage.available_frames);options('view',report.config.views.map(v=>v.name));
for(const entry of report.summary){const tr=document.createElement('tr');for(const val of [entry.view+' / '+entry.region,entry.count,fmt(entry.baseline?.iou),fmt(entry.candidate.iou),fmt(entry.iou_gain)]){const td=document.createElement('td');td.textContent=val;tr.append(td)}if(entry.iou_gain<0)tr.className='bad';$('summary').append(tr)}
function update(){const f=Number($('frame').value),v=$('view').value;options('region',[...new Set(report.rows.filter(r=>r.frame===f&&r.view===v).map(r=>r.region))]);const row=report.rows.find(r=>r.frame===f&&r.view===v&&r.region===$('region').value),asset=report.assets.find(a=>a.frame===f&&a.view===v);if(!asset){$('metrics').textContent='没有可比较帧，请检查缺帧列表。';return}for(const name of ['reference','candidate','baseline','overlay','mask']){const path=asset.images[name];if(path)$(name).src=path}$('before-card').hidden=!asset.images.baseline;$('bottom').src=asset.images.reference;$('top').src=asset.images.candidate;$('top').style.opacity=$('alpha').value;$('overlay').hidden=!$('contour').checked;$('bottom').parentElement.hidden=$('contour').checked;$('metrics').textContent=`帧 ${f} · ${(f/report.config.fps).toFixed(3)}s · ${v}/${row.region} | IoU ${fmt(row.baseline?.iou)} → ${fmt(row.candidate.iou)} | Δ ${fmt(row.iou_gain)} | 边界均距 ${fmt(row.baseline?.boundary_mean_px,2)} → ${fmt(row.candidate.boundary_mean_px,2)} px | P95 ${fmt(row.candidate.boundary_p95_px,2)} px`}
for(const id of ['frame','view','region','alpha','contour'])$(id).addEventListener('input',update);update();
</script></html>
